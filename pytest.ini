[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir

log_cli = true
log_cli_level = INFO


markers =
    smoke: fast pre-deploy checks
    regression: full test suite
    manual: needs a person to type in a headed browser (not for CI)